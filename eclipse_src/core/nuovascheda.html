<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Nuova scheda</title>
<script src="colore.js"></script><script src="comune.js"></script><script src="bang.js"></script><link rel="stylesheet" href="stile.css">
<style>
html{background:#08070d}body{background:transparent;display:flex;flex-direction:column;align-items:center;padding-top:9vh;overflow:hidden}
#sf{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 60% 55% at 60% 28%,var(--acc-luce) 0%,var(--acc-buio) 45%,#08070d 80%);background-size:cover;background-position:center}
#sf.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,13,.55),rgba(8,7,13,.35) 45%,rgba(8,7,13,.6))}
#sf.tinta{background:var(--acc-buio)}
.ora{font-size:64px;font-weight:200;letter-spacing:.04em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.5)}.data{font-size:13px;color:#d6d1e6;margin:6px 0 18px;text-transform:capitalize;letter-spacing:.06em}
.logo{width:104px;height:104px}.nm{font-size:42px;font-weight:200;letter-spacing:.32em;margin:14px 0 0 .32em}.sub{font-size:11px;letter-spacing:.42em;color:#bdb7d0;margin-top:4px}
body.con-ora .logo{width:64px;height:64px}body.con-ora .nm{font-size:28px;margin-top:8px}
form{margin-top:30px;width:min(600px,86vw);position:relative}input#q{width:100%;height:50px;border-radius:25px;background:rgba(14,12,22,.85);border:1px solid rgba(255,255,255,.14);color:var(--fg);font-size:15px;padding:0 22px;outline:none}
input#q:focus{border-color:var(--acc-chiaro)}
.bangtip{position:absolute;right:16px;top:15px;font-size:12px;color:var(--acc-chiaro);background:rgba(14,12,22,.9);padding:2px 9px;border-radius:9px;display:none}
.g{display:flex;gap:22px;margin-top:32px;flex-wrap:wrap;justify-content:center}.t{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#e6e2f2;text-decoration:none;width:70px;position:relative;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:rgba(14,12,22,.55);border:1px solid rgba(255,255,255,.14);overflow:hidden;backdrop-filter:blur(6px)}
.ic img{width:28px;height:28px}.t .x{position:absolute;top:-6px;right:2px;display:none;width:18px;height:18px;border-radius:50%;background:#2a2638;color:#ddd;font-size:11px;line-height:18px;text-align:center;cursor:pointer}
.t:hover .x{display:block}.agg .ic{border-style:dashed;color:var(--dim);font-size:22px}
.pill{position:fixed;bottom:18px;font-size:12px;color:#cfcbe0;background:rgba(14,12,22,.8);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:7px 14px}.pill b{color:var(--acc-chiaro)}
.pers{position:fixed;right:18px;bottom:16px;font-size:12.5px;color:#e6e2f2;background:rgba(14,12,22,.8);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 14px;cursor:pointer;font-family:inherit}
.pers:hover{border-color:var(--acc-chiaro)}
#pan{position:fixed;top:0;right:0;bottom:0;width:340px;background:#14121c;border-left:1px solid var(--bordo);padding:20px 20px 24px;transform:translateX(100%);transition:transform .2s;overflow:auto;z-index:5}
#pan.su{transform:none}#pan h3{margin:0 0 4px;font-size:16px;font-weight:600}#pan .ch{position:absolute;right:16px;top:16px;background:none;border:0;color:#bbb;font-size:18px;cursor:pointer}
#pan h4{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 8px}
.sfg{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sfo{height:74px;border-radius:10px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;position:relative;overflow:hidden}
.sfo span{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:3px 7px;background:rgba(8,7,13,.7)}.sfo.on{border-color:var(--acc-chiaro)}
.sfo.ecl{background:radial-gradient(ellipse 70% 70% at 60% 30%,var(--acc-luce),var(--acc-buio) 50%,#08070d 90%)}.sfo.tin{background:var(--acc-buio)}
.sfo.foto{background:#1e1b2a;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:22px}
.riga{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #221f30;font-size:13px}.riga div{flex:1}.riga small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.int{width:40px;height:22px;border-radius:11px;background:#3a3550;position:relative;cursor:pointer;flex:none;border:0}
.int::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.int.on{background:var(--acc)}.int.on::after{left:21px}
/* (11/11) stile OLED: nero puro, viola molto scuro, icone con bordo viola sottile; Personalizza nascosto */
html{background:#000!important}body{background:#000!important}
#sf{background:radial-gradient(ellipse 55% 45% at 50% 30%,rgba(43,16,87,.55) 0%,rgba(20,8,40,.25) 45%,#000 80%)!important}
.nm{color:#F1EDFA}.sub{color:#8C86A3}
.g{border:1px solid #6B3FD9!important;background:#06040d!important}.g:hover{border-color:#9157FF!important}
.pers{display:none!important}
</style></head><body>
<div id="sf"></div>
<div id="orologio" style="display:none;text-align:center"><div class="ora" id="ora"></div><div class="data" id="data"></div></div>
<img class="logo" id="logo" src="logo.svg" alt=""><div class="nm" id="nm">ECLIPSE</div><div class="sub" id="sub">BY LOLLOZZOS</div>
<form id="f"><input id="q" placeholder="Cerca sul web o scrivi un indirizzo" autofocus autocomplete="off"><span class="bangtip" id="bt"></span></form>
<div class="g" id="g"></div><div class="pill" id="pill"></div>
<button class="pers" id="apri">✎ Personalizza</button>
<div id="pan"><button class="ch" id="chiudi">✕</button><h3>Personalizza Eclipse</h3>
<h4>Sfondo</h4><div class="sfg" id="sfg"></div><input type="file" id="file" accept="image/*" style="display:none">
<h4>Nella pagina</h4>
<div class="riga"><div>Orologio<small>ora e data sopra il logo</small></div><button class="int" data-k="orologio"></button></div>
<div class="riga"><div>Logo Eclipse<small>toglilo se lo sfondo ha già una scritta</small></div><button class="int" data-k="logo"></button></div>
<div class="riga"><div>Scorciatoie "!"<small>"!yt gatti" cerca su YouTube, "!a" Amazon, "!w" Wikipedia…</small></div><button class="int" data-k="bang"></button></div>
</div>
<script src="nuovascheda.js"></script></body></html>
